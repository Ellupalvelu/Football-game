<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultimate Football 3D</title>
<style>
body{margin:0;background:#071522;color:white;font-family:Arial;text-align:center}
h2{margin:10px;color:#baff42}
canvas{width:100%;max-width:960px;display:block;margin:auto;touch-action:none}
button,select{padding:12px;margin:4px;border:0;border-radius:10px;background:#203b52;color:white;font-weight:bold}
button:active{background:#baff42;color:black}
#score{font-size:30px;font-weight:bold}
.controls{max-width:500px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
</style>
</head>
<body>
<h2>⚽ ULTIMATE FOOTBALL 3D</h2>
<div id="score">BLUE 0 - 0 RED</div>
<div id="clock">00:00</div>
<canvas id="game" width="900" height="520"></canvas>
<div>
<button onclick="pass()">PASS</button>
<button onclick="shoot()">SHOOT ⚡</button>
<button onclick="switchPlayer()">SWITCH PLAYER</button>
<button onclick="sprint=!sprint">SPRINT 🏃</button>
<button onclick="restart()">RESTART ↻</button>
</div>
<div class="controls">
<button onclick="move(0,-1)">▲</button>
<button onclick="move(0,-1)">↑</button>
<button onclick="move(0,-1)">▲</button>
<button onclick="move(-1,0)">◀</button>
<button onclick="move(0,1)">▼</button>
<button onclick="move(1,0)">▶</button>
</div>
<p>Keyboard: WASD / arrows · E = pass · SPACE = shoot · Q = switch</p>
<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const W=900,H=520;
let blue=[],red=[],ball,scoreB=0,scoreR=0;
let selected=0,sprint=false,keys={},elapsed=0,paused=false;
let last=0;

function player(team,x,y,n){
 return {team,x,y,n,vx:0,vy:0,homeX:x,homeY:y};
}
function restart(){
 blue=[
 player(0,160,260,1),
 player(0,300,130,2),
 player(0,300,390,3),
 player(0,420,210,4),
 player(0,420,310,5)
 ];
 red=[
 player(1,740,260,1),
 player(1,600,130,2),
 player(1,600,390,3),
 player(1,500,210,4),
 player(1,500,310,5)
 ];
 ball={x:W/2,y:H/2,vx:0,vy:0,owner:0};
 scoreB=scoreR=elapsed=0;selected=0;paused=false;
 blue[0].x=430;blue[0].y=260;
 updateScore();
}
function updateScore(){
 document.getElementById("score").textContent=
 "BLUE "+scoreB+" - "+scoreR+" RED";
}
function move(dx,dy){
 let p=blue[selected];
 let s=sprint?35:20;
 p.x=Math.max(25,Math.min(W-25,p.x+dx*s));
 p.y=Math.max(25,Math.min(H-25,p.y+dy*s));
 if(ball.owner===selected){
 ball.x=p.x+14;ball.y=p.y+4;
 }
}
function pass(){
 let p=blue[selected];
 let mates=blue.filter(q=>q!==p);
 mates.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-
 Math.hypot(b.x-p.x,b.y-p.y));
 let t=mates.find(q=>q.x>p.x)||mates[0];
 ball.owner=null;ball.x=p.x;ball.y=p.y;
 let d=Math.hypot(t.x-p.x,t.y-p.y)||1;
 ball.vx=(t.x-p.x)/d*9;
 ball.vy=(t.y-p.y)/d*9;
 setTimeout(()=>{if(ball.owner===null){
 ball.owner=blue.indexOf(t);
 }},350);
}
function shoot(){
 let p=blue[selected];
 ball.owner=null;ball.x=p.x;ball.y=p.y;
 let d=Math.hypot(W-p.x,H/2-p.y)||1;
 ball.vx=(W-p.x)/d*14;
 ball.vy=(H/2-p.y)/d*14;
}
function switchPlayer(){
 let best=0,d=Infinity;
 blue.forEach((p,i)=>{
 let n=Math.hypot(p.x-ball.x,p.y-ball.y);
 if(n<d){d=n;best=i}
 });
 selected=best;
}
function drawPitch(){
 ctx.fillStyle="#277c3e";ctx.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){
 ctx.fillStyle=i%2?"#2c8745":"#328e49";
 ctx.fillRect(i*90,0,90,H);
 }
 ctx.strokeStyle="white";ctx.lineWidth=3;
 ctx.strokeRect(15,15,W-30,H-30);
 ctx.beginPath();ctx.moveTo(W/2,15);
 ctx.lineTo(W/2,H-15);ctx.stroke();
 ctx.beginPath();ctx.arc(W/2,H/2,70,0,7);ctx.stroke();
 ctx.strokeRect(15,160,120,200);
 ctx.strokeRect(W-135,160,120,200);
 ctx.strokeRect(15,205,50,110);
 ctx.strokeRect(W-65,205,50,110);
}
function drawPlayer(p,i){
 ctx.fillStyle=p.team===0?"#168bff":"#f33e50";
 ctx.beginPath();ctx.arc(p.x,p.y,13,0,7);ctx.fill();
 ctx.strokeStyle=p.team===0&&i===selected?"#caff45":"white";
 ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle="white";ctx.font="bold 12px Arial";
 ctx.textAlign="center";ctx.fillText(p.n,p.x,p.y+4);
}
function update(dt){
 if(paused)return;
 elapsed+=dt;
 document.getElementById("clock").textContent=
 String(Math.floor(elapsed/60)).padStart(2,"0")+":"+
 String(Math.floor(elapsed%60)).padStart(2,"0");
 if(ball.owner===null){
 ball.x+=ball.vx;ball.y+=ball.vy;
 ball.vx*=.985;ball.vy*=.985;
 if(ball.y<20||ball.y>H-20)ball.vy*=-.8;
 if(ball.x<10||ball.x>W-10){
 if(Math.abs(ball.y-H/2)<75){
 if(ball.x>W/2)scoreB++;else scoreR++;
 updateScore();restartPositions();
 }else ball.vx*=-.8;
 }
 let all=blue.concat(red);
 for(let i=0;i<all.length;i++){
 if(Math.hypot(all[i].x-ball.x,all[i].y-ball.y)<20){
 ball.owner=i<5?i:i;
 if(i<5)selected=i;
 ball.vx=ball.vy=0;break;
 }
 }
 }else{
 let p=ball.owner<5?blue[ball.owner]:red[ball.owner-5];
 if(p){ball.x=p.x+(p.team===0?15:-15);ball.y=p.y+5}
 }
 // AI movement
 red.forEach(p=>{
 let target=ball.owner===null?ball:
 (ball.owner<5?blue[ball.owner]:ball);
 let dx=target.x-p.x,dy=target.y-p.y;
 let d=Math.hypot(dx,dy)||1;
 p.x+=dx/d*55*dt;p.y+=dy/d*55*dt;
 p.x=Math.max(20,Math.min(W-20,p.x));
 p.y=Math.max(20,Math.min(H-20,p.y));
 });
 blue.forEach((p,i)=>{
 if(i!==selected){
 let dx=p.homeX-p.x,dy=p.homeY-p.y;
 p.x+=dx*dt*.7;p.y+=dy*dt*.7;
 }
 });
 // Possession challenges
 if(ball.owner!==null){
 let owner=ball.owner<5?blue[ball.owner]:red[ball.owner-5];
 let opponents=owner.team===0?red:blue;
 opponents.forEach(p=>{
 if(Math.hypot(p.x-owner.x,p.y-owner.y)<20&&Math.random()<dt*1.5){
 ball.owner=owner.team===0?5+red.indexOf(p):blue.indexOf(p);
 }
 });
 }
}
function restartPositions(){
 blue.forEach(p=>{p.x=p.homeX;p.y=p.homeY});
 red.forEach(p=>{p.x=p.homeX;p.y=p.homeY});
 ball.x=W/2;ball.y=H/2;ball.vx=ball.vy=0;ball.owner=0;
}
function render(){
 drawPitch();
 // goal nets
 ctx.fillStyle="#ddd";ctx.fillRect(0,H/2-75,15,150);
 ctx.fillRect(W-15,H/2-75,15,150);
 blue.forEach(drawPlayer);red.forEach(drawPlayer);
 ctx.fillStyle="white";ctx.beginPath();
 ctx.arc(ball.x,ball.y,8,0,7);ctx.fill();
 ctx.strokeStyle="#111";ctx.stroke();
}
function frame(t){
 let dt=Math.min((t-last)/1000||0,.04);last=t;
 update(dt);render();requestAnimationFrame(frame);
}
window.addEventListener("keydown",e=>{
 let k=e.key.toLowerCase();keys[k]=true;
 if(k===" "){e.preventDefault();shoot()}
 if(k==="e")pass();
 if(k==="q")switchPlayer();
 if(k==="shift")sprint=true;
 if(k==="arrowup"||k==="w")move(0,-1);
 if(k==="arrowdown"||k==="s")move(0,1);
 if(k==="arrowleft"||k==="a")move(-1,0);
 if(k==="arrowright"||k==="d")move(1,0);
});
window.addEventListener("keyup",e=>{
 if(e.key==="Shift")sprint=false;
});
function loopMove(){
 if(keys.ArrowUp||keys.w)move(0,-1);
 if(keys.ArrowDown||keys.s)move(0,1);
 if(keys.ArrowLeft||keys.a)move(-1,0);
 if(keys.ArrowRight||keys.d)move(1,0);
 requestAnimationFrame(loopMove);
}
document.querySelectorAll(".controls button").forEach(b=>{
 b.addEventListener("pointerdown",e=>{e.preventDefault();let txt=b.textContent;
 if(txt==="▲"||txt==="↑")move(0,-1);
 if(txt==="▼")move(0,1);if(txt==="◀")move(-1,0);if(txt==="▶")move(1,0);
 });
});
restart();loopMove();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
